<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Details - RoboClub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="home-page">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-container">
                <a href="home.html" class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    RoboClub
                </a>
                <div class="nav-links" id="navLinks">
                    <!-- Navigation will be populated by JavaScript -->
                </div>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            </div>
            <!-- Mobile Menu -->
            <div class="mobile-menu" id="mobileMenu">
                <!-- Mobile menu will be populated by JavaScript -->
            </div>
        </nav>

        <!-- Robot Detail Section -->
        <section class="section" style="padding-top: 120px;">
            <div class="section-container">
                <!-- Back Button -->
                <a href="robots.html" class="btn btn-secondary" style="margin-bottom: 24px; display: inline-flex; align-items: center; gap: 8px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Robots
                </a>

                <!-- Robot Detail Container -->
                <div id="robotDetailContainer" style="max-width: 1200px; margin: 0 auto;">
                    <!-- Loading State -->
                    <div style="text-align: center; padding: 60px 20px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 64px; height: 64px; margin: 0 auto 16px; color: #a855f7; animation: spin 2s linear infinite;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 6v6l4 2"></path>
                        </svg>
                        <h3 style="color: white;">Loading Robot Details...</h3>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Styles -->
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            margin-top: 32px;
        }

        @media (min-width: 768px) {
            .detail-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .detail-image-container {
            background: linear-gradient(135deg, #581c87, #7e22ce);
            border-radius: 16px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        .detail-image-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .detail-image-container img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 8px;
            position: relative;
            z-index: 1;
        }

        .detail-info {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .detail-header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            color: white;
        }

        .detail-brand {
            color: #a855f7;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-price {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }

        .detail-description {
            color: #e5e7eb;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .detail-specs {
            background: rgba(51, 65, 85, 0.6);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .detail-specs h3 {
            color: white;
            margin-bottom: 16px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
        }

        .spec-item:last-child {
            border-bottom: none;
        }

        .spec-label {
            color: #9ca3af;
            font-weight: 600;
        }

        .spec-value {
            color: white;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .action-buttons .btn {
            flex: 1;
            min-width: 150px;
        }
    </style>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initializeNavigation();
            loadRobotDetail();
        });

        async function loadRobotDetail() {
            const params = new URLSearchParams(window.location.search);
            const robotId = params.get('id');

            if (!robotId) {
                window.location.href = 'robots.html';
                return;
            }

            const container = document.getElementById('robotDetailContainer');

            try {
                const response = await fetch(`https://backnode-50az.onrender.com/api/products/${robotId}`);
                
                if (!response.ok) {
                    throw new Error('Robot not found');
                }

                const data = await response.json();
                const robot = data.data || data;

                const hasDiscount = robot.discount && robot.discount.percentage > 0;
                const finalPrice = hasDiscount ? 
                    (robot.price * (1 - robot.discount.percentage / 100)).toFixed(2) : 
                    robot.price.toFixed(2);

                const imageUrl = robot.images && robot.images.length > 0 ? 
                    robot.images[0].url : null;

                const stars = Math.round(robot.rating?.average || 0);
                const ratingStars = '★'.repeat(stars) + '☆'.repeat(5 - stars);

                const stockStatus = robot.stock === 0 ? 'out-of-stock' : 
                                   robot.stock < 10 ? 'low-stock' : 'in-stock';
                const stockText = robot.stock === 0 ? 'Out of Stock' : 
                                 robot.stock < 10 ? `Only ${robot.stock} left` : 
                                 `${robot.stock} in stock`;

                container.innerHTML = `
                    <!-- Header -->
                    <div class="detail-header" style="text-align: center; margin-bottom: 32px;">
                        ${robot.brand ? `<span class="detail-brand">${robot.brand}</span>` : ''}
                        <h1>${robot.name}</h1>
                        ${robot.rating && robot.rating.count > 0 ? `
                            <div style="color: #fbbf24; font-size: 1.5rem; margin-top: 8px;">
                                ${ratingStars}
                                <span style="color: #9ca3af; font-size: 1rem; margin-left: 8px;">(${robot.rating.count} reviews)</span>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Detail Grid -->
                    <div class="detail-grid">
                        <!-- Image Section -->
                        <div class="detail-image-container">
                            ${hasDiscount ? `<div class="discount-badge">-${robot.discount.percentage}% OFF</div>` : ''}
                            ${imageUrl ? 
                                `<img src="${imageUrl}" alt="${robot.name}">` : 
                                `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 200px; height: 200px; color: rgba(255,255,255,0.5); position: relative; z-index: 1;">
                                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                </svg>`
                            }
                            <div class="robot-badge">${robot.category}</div>
                        </div>

                        <!-- Info Section -->
                        <div class="detail-info">
                            <div class="detail-price">
                                ${hasDiscount ? `<span style="text-decoration: line-through; color: #9ca3af; font-size: 1.5rem; margin-right: 8px;">$${robot.price.toFixed(2)}</span>` : ''}
                                $${finalPrice}
                            </div>

                            <p class="detail-description">${robot.description}</p>

                            <!-- Specifications -->
                            <div class="detail-specs">
                                <h3>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 24px; height: 24px;">
                                        <line x1="4" y1="9" x2="20" y2="9"></line>
                                        <line x1="4" y1="15" x2="20" y2="15"></line>
                                        <line x1="10" y1="3" x2="8" y2="21"></line>
                                        <line x1="16" y1="3" x2="14" y2="21"></line>
                                    </svg>
                                    Specifications
                                </h3>
                                <div class="spec-item">
                                    <span class="spec-label">Category</span>
                                    <span class="spec-value">${robot.category}</span>
                                </div>
                                ${robot.brand ? `
                                    <div class="spec-item">
                                        <span class="spec-label">Brand</span>
                                        <span class="spec-value">${robot.brand}</span>
                                    </div>
                                ` : ''}
                                <div class="spec-item">
                                    <span class="spec-label">Availability</span>
                                    <span class="spec-value stock-badge ${stockStatus}">${stockText}</span>
                                </div>
                                ${robot.rating && robot.rating.count > 0 ? `
                                    <div class="spec-item">
                                        <span class="spec-label">Rating</span>
                                        <span class="spec-value">${robot.rating.average.toFixed(1)}/5.0</span>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Tags -->
                            ${robot.tags && robot.tags.length > 0 ? `
                                <div style="margin-bottom: 24px;">
                                    <h4 style="color: white; margin-bottom: 12px; font-size: 1.1rem;">Features</h4>
                                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                        ${robot.tags.map(tag => `<span class="spec-tag">${tag}</span>`).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Action Buttons -->
                            <div class="action-buttons">
                                ${robot.isAvailable && robot.stock > 0 ? `
                                    <button class="btn btn-primary">Add to Cart</button>
                                    <a href="contact.html" class="btn btn-secondary">Contact Us</a>
                                ` : `
                                    <button class="btn btn-secondary" disabled style="flex: 1;">Out of Stock</button>
                                `}
                            </div>
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error('Error loading robot details:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 64px; height: 64px; margin: 0 auto 16px; color: #f87171;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <h3 style="color: white; margin-bottom: 8px;">Robot Not Found</h3>
                        <p style="color: #9ca3af; margin-bottom: 24px;">The robot you're looking for doesn't exist or has been removed.</p>
                        <a href="robots.html" class="btn btn-primary">Back to Robots Gallery</a>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
